<!DOCTYPE html>
<html>
<head>
    <title>Smart Waste System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">
    <h1>Smart Waste Segregation</h1>

    <button class="start-btn" onclick="startSystem()">Start Detection</button>

    <div class="charts">
        <div class="chart-box">
            <canvas id="plasticChart"></canvas>
            <h3>Plastic</h3>
        </div>

        <div class="chart-box">
            <canvas id="paperChart"></canvas>
            <h3>Paper & cardboard</h3>
        </div>

        <div class="chart-box">
            <canvas id="metalChart"></canvas>
            <h3>Biodegradable</h3>
        </div>
    </div>
</div>

<script>
let charts = {};

function createChart(id) {
    return new Chart(document.getElementById(id), {
        type: 'doughnut',
        data: {
            datasets: [{
                data: [0, 100],
                backgroundColor: ['#00ffcc', '#222'],
                borderWidth: 0
            }]
        },
        options: {
            cutout: '75%',
            plugins: { legend: { display: false } }
        }
    });
}

charts.plastic = createChart("plasticChart");
charts.paper = createChart("paperChart");
charts.metal = createChart("metalChart");

function startSystem() {
    fetch('/start');
}

function updateStats() {
    fetch('/stats')
    .then(res => res.json())
    .then(data => {

        for (let type in charts) {
            let percent = data.percentages[type];
            charts[type].data.datasets[0].data = [percent, 100 - percent];
            charts[type].update();
        }

        if (data.active) {
            let box = document.getElementById(data.active + "Chart").parentElement;
            box.classList.add("glow");

            setTimeout(() => {
                box.classList.remove("glow");
            }, 3000);
        }
    });
}

setInterval(updateStats, 1500);
</script>

</body>
</html>
